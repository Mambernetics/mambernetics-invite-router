<!DOCTYPE html>
<html>
<head>
  <title>Mambernetics Invite Router</title>
</head>

<body style="font-family: Arial; text-align: center; margin-top: 80px;">
  <h2>Mambernetics Invitation Check</h2>
  <p id="status">Checking invitation...</p>

<script>

/* =========================
   1. INVITATION DATABASE
   ========================= */
const invites = {
  "ABC123": true,
  "Q7M4K8XN": true,
  "R6T9H3VC": true
};

/* =========================
   2. READ CODE FROM URL
   Example:
   ?code=ABC123
   ========================= */
const formBaseUrl =
  "https://forms.gle/okvLtbJuUCz11CTL8?usp=pp_url&entry.1068490562=";
const params = new URLSearchParams(window.location.search);
const code = params.get("code");

/* =========================
   3. MAIN LOGIC
   ========================= */

if (!code) {
  document.getElementById("status").innerText =
    "No invitation code provided.";

} else if (invites[code]) {

  document.getElementById("status").innerText =
    "Valid invite. Redirecting...";

const finalUrl = formBaseUrl + code;

// show debug info on screen
document.getElementById("status").innerHTML =
  "Valid invite.<br><br>Redirecting in 30 seconds...<br><br>" +
  "<code style='word-break:break-all;'>" + finalUrl + "</code>";

setTimeout(() => {
  window.location.href = finalUrl;
}, 30000);


} else {
  document.getElementById("status").innerText =
    "Invalid or expired invitation code.";
}
</script>

</body>
</html>
