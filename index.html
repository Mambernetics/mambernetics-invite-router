<!DOCTYPE html>
<html>
<head>
  <title>Mambernetics Invite Router</title>
</head>

<body style="font-family: Arial; text-align: center; margin-top: 80px;">
<h2>Welcome to the Mambernetics 2026 Dinner Invitation Portal</h2>  
<img src="images/logo.jpg" alt="Logo" style="max-width: 200px;">
  <h2>Mambernetics Invitation Check</h2>
  <p id="status">Loading...</p>

<script>

const DEBUG = false;

const formBaseUrl =
  "https://docs.google.com/forms/d/e/1FAIpQLSeDNLcKMmbQiuglu6eKyJZtPNrqDWbvDxGQ-BBvwXv3ro_XfA/viewform?usp=pp_url&entry.1068490562=";

/* =========================
   STATE
   ========================= */
let invites = {};
let code = "";

/* =========================
   1. INPUT PHASE
   ========================= */
function getCodeFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get("code");
}

/* =========================
   2. LOAD PHASE
   ========================= */
async function loadInvites() {
  try {
    const res = await fetch("invites.json?v=" + Date.now());
    invites = await res.json();

    runApp(); // ONLY runs AFTER data is ready

  } catch (err) {
    document.getElementById("status").innerText =
      "Failed to load invitation data.";
    console.error(err);
  }
}

/* =========================
   3. RUN PHASE (CORE LOGIC)
   ========================= */
function runApp() {

  const redirectDelay = DEBUG ? 8000 : 2000;

  code = getCodeFromUrl();

  console.log("Code received:", code);
  console.log("Invites loaded:", invites);

  if (!code) {

    document.getElementById("status").innerHTML =
      "No invitation code provided.";

    return;
  }

  const invite = invites[code];

  if (invite && invite.status === "active") {

    const finalUrl = formBaseUrl + code;

    if (DEBUG) {
      document.getElementById("status").innerHTML =
        "Valid invite.<br><br>" +
        "Redirecting in " + (redirectDelay / 1000) + " seconds...<br><br>" +
        "<code style='word-break:break-all;'>" + finalUrl + "</code>";
    } else {
      document.getElementById("status").innerText =
        "Valid invite. Redirecting...";
    }

    setTimeout(() => {
      window.location.href = finalUrl;
    }, redirectDelay);

  } else {

    if (DEBUG) {
      document.getElementById("status").innerHTML =
        "This invitation link appears invalid or expired:<br><br>" +
        "<code style='word-break:break-all;'>" + code + "</code><br><br>" +
		"If you believe this is an error, please contact the event organizer.";
    } else {
      document.getElementById("status").innerText =
        "This invitation link appears invalid or expired.<br><br>" +
		"If you believe this is an error, please contact the event organizer.";
    }
  }
}

/* =========================
   START APP (ONLY ENTRY POINT)
   ========================= */
loadInvites();

</script>

</body>
</html>
